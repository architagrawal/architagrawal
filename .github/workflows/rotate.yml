name: Rotate scene

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Write README for today's scene
        id: pick
        run: echo "scene=$(.github/rotate.sh)" >> "$GITHUB_OUTPUT"
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Rotate scene to ${{ steps.pick.outputs.scene }}"
          git push
