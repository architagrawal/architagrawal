<svg xmlns="http://www.w3.org/2000/svg" width="900" height="152" viewBox="0 0 900 152" role="img" aria-label="Perfection is achieved not when there is nothing more to add, but when there is nothing left to take away. Antoine de Saint-Exupéry">
<style>@font-face{font-family:Figtree;font-weight:300 900;src:url(data:font/woff2;base64,) format("woff2")}text{font-family:Figtree,system-ui,sans-serif;text-anchor:middle}
.lbl{font-size:14px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;transform:translateX(.12em)}.q{font-size:25px;font-weight:400;fill:hsl(285 25% 93% / 0.82)}.lbl{font-size:12px;fill:hsl(285 18% 62%)}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<text class="q" x="450" y="66">“Perfection is achieved not when there is nothing more</text>
<text class="q" x="450" y="100">to add, but when there is nothing left to take away.”</text>
<text class="lbl" x="450" y="140">Antoine de Saint-Exupéry</text>
</svg>
