<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="A painted landscape">
<defs><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="m"><rect width="1200" height="440" fill="url(#f)"/></mask><clipPath id="r"><rect width="1200" height="440" rx="22"/></clipPath></defs>
<style>.drift{transform-origin:600px 220px;animation:drift 30s ease-in-out infinite alternate}@keyframes drift{from{transform:scale(1)}to{transform:scale(1.06) translateX(-10px)}}@media (prefers-reduced-motion:reduce){.drift{animation:none}}</style>
<g clip-path="url(#r)" mask="url(#m)"><g class="drift"><image href="data:image/svg+xml;base64," width="1200" height="440" preserveAspectRatio="xMidYMid slice"/></g></g></svg>
