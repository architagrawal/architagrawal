<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="A painted landscape">
<style>.drift{transform-origin:600px 110px;animation:drift 24s ease-in-out infinite alternate}@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07) translateX(-12px)}}@media (prefers-reduced-motion:reduce){.drift{animation:none}}</style>
<clipPath id="r"><rect width="1200" height="220" rx="24"/></clipPath>
<g clip-path="url(#r)"><g class="drift"><image href="data:image/svg+xml;base64," width="1200" height="220" preserveAspectRatio="xMidYMid slice"/></g></g></svg>
